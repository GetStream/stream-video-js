name: Check PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    # Calls the GitHub API, and the org IP allow list only admits static-IP runners.
    runs-on:
      group: github-public-ubuntu-static
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
