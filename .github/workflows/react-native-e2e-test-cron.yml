name: React Native E2E Tests Nightly

on:
  schedule:
    - cron: '0 1 * * 1-5'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FASTLANE_SKIP_UPDATE_CHECK: 1
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Keep in sync with `install_video_buddy` in the dogfood Fastfile.
  PLAYWRIGHT_VERSION: '1.52.0'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [36, 34, 31, 28]
    env:
      # No camera: with an emulated one, `call.join()` sometimes never resolves (RN-474).
      ANDROID_EMULATOR_OPTIONS: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
      DETOX_ADB_NAME: 'emulator-5554'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/rn-e2e-setup
      - uses: ./.github/actions/rn-e2e-android-app
      - uses: ./.github/actions/rn-e2e-enable-kvm
      - name: Cache stream-video-buddy's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Launch Allure TestOps
        working-directory: sample-apps/react-native/dogfood
        run: bundle exec fastlane allure_launch cron:true

      - name: Run e2e tests (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel
          emulator-options: ${{ env.ANDROID_EMULATOR_OPTIONS }}
          disable-animations: true
          working-directory: sample-apps/react-native/dogfood
          script: bundle exec fastlane test_e2e platform:android device:att skip_build:true

      - name: Upload Allure results
        if: env.LAUNCH_ID != '' && (success() || failure())
        working-directory: sample-apps/react-native/dogfood
        run: bundle exec fastlane allure_upload launch_id:"$LAUNCH_ID"

      - name: Allure TestOps Launch Removal
        if: env.LAUNCH_ID != '' && cancelled()
        working-directory: sample-apps/react-native/dogfood
        run: bundle exec fastlane allure_launch_removal launch_id:"$LAUNCH_ID"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-nightly-android-${{ matrix.api-level }}
          path: |
            sample-apps/react-native/e2e-test-app/artifacts
            sample-apps/react-native/e2e-test-app/recordings
            sample-apps/react-native/e2e-test-app/video-buddy-*.log
            /tmp/android-runner

  ios:
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: '27.0'
            device: 'iPhone 18 Pro'
            setup_runtime: false
          - ios: '17.5'
            device: 'iPhone 15 Pro'
            setup_runtime: true
    env:
      DETOX_IOS_DEVICE: ${{ matrix.device }}
      IOS_VERSION: ${{ matrix.ios }}
      XCODE_VERSION: '27.1'
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode version
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"
      - uses: ./.github/actions/rn-e2e-setup
      - uses: ./.github/actions/rn-e2e-ios-runtime
        if: ${{ matrix.setup_runtime }}
        with:
          version: ${{ matrix.ios }}
          device: ${{ matrix.device }}
      # A fresh simulator takes minutes to boot on CI; boot it now so that overlaps with the build.
      - name: Boot simulator
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
          udid=$(xcrun simctl list devices available -j |
            jq -r --arg rt "$runtime" --arg name "$DETOX_IOS_DEVICE" '.devices[$rt][]? | select(.name == $name) | .udid' | head -1)
          if [ -z "$udid" ]; then
            echo "::error::No $DETOX_IOS_DEVICE on iOS $IOS_VERSION"
            exit 1
          fi
          echo "DETOX_IOS_UDID=$udid" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$udid" > /dev/null 2>&1 &
      - uses: ./.github/actions/rn-e2e-ios-app
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: ./.github/actions/rn-e2e-ios-tooling
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Cache stream-video-buddy's browser
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Launch Allure TestOps
        working-directory: sample-apps/react-native/dogfood
        run: bundle exec fastlane allure_launch cron:true

      - name: Wait for the simulator
        timeout-minutes: 15
        # `-b` boots it if the background boot never started; it errors (405) when the device is
        # already booted, and then the plain call returns at once.
        run: xcrun simctl bootstatus "$DETOX_IOS_UDID" -b || xcrun simctl bootstatus "$DETOX_IOS_UDID"
      - name: Run e2e tests
        working-directory: sample-apps/react-native/dogfood
        run: bundle exec fastlane test_e2e platform:ios skip_build:true

      - name: Upload Allure results
        if: env.LAUNCH_ID != '' && (success() || failure())
        working-directory: sample-apps/react-native/dogfood
        run: bundle exec fastlane allure_upload launch_id:"$LAUNCH_ID"

      - name: Allure TestOps Launch Removal
        if: env.LAUNCH_ID != '' && cancelled()
        working-directory: sample-apps/react-native/dogfood
        run: bundle exec fastlane allure_launch_removal launch_id:"$LAUNCH_ID"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-nightly-ios-${{ matrix.ios }}
          path: |
            sample-apps/react-native/e2e-test-app/artifacts
            sample-apps/react-native/e2e-test-app/recordings
            sample-apps/react-native/e2e-test-app/video-buddy-*.log

  slack:
    name: Slack Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [android, ios]
    if: failure() && github.event_name == 'schedule'
    steps:
      - uses: 8398a7/action-slack@v3
        with:
          status: cancelled
          text: 'You shall not pass!'
          job_name: '${{ github.workflow }}: ${{ github.job }}'
          fields: repo,commit,author,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_NIGHTLY_CHECKS }}
