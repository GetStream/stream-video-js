buildscript {
  ext.NoiseCancellationReactNative = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return NoiseCancellationReactNative[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "io.getstream.rn.noisecancellation"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

rootProject.allprojects {
  repositories {
    maven {
      name = 'Central Portal Snapshots'
      url = 'https://central.sonatype.com/repository/maven-snapshots/'
      content {
        includeModule('io.getstream', 'stream-video-android-noise-cancellation-libwebrtc')
      }
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation 'io.getstream:stream-video-android-noise-cancellation-libwebrtc:3.0.0'
  implementation project(':stream-io_react-native-webrtc')
}
