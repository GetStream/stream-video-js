buildscript {
  ext.Callingx = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 35
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return Callingx[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "kotlin-parcelize"

apply plugin: "com.facebook.react"

android {
  namespace "io.getstream.rn.callingx"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.core:core-telecom:1.0.1"
  // Pinned at the MINIMUM version we need, not the latest, so a consumer's own
  // Firebase BOM is respected via Gradle's highest-wins resolution. Callingx only
  // references stable long-lived APIs — FirebaseMessagingService, RemoteMessage,
  // and FirebaseMessaging.getInstance().getToken() returning Task<String> — all
  // of which have existed since firebase-messaging 21.0.0.
  api "com.google.firebase:firebase-messaging:21.0.0"
}
